<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚌 上海公交小可爱</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --pink: #FFB6C1;
    --mint: #98FB98;
    --sky: #87CEEB;
    --peach: #FFDAB9;
    --lavender: #E6E6FA;
    --yellow: #FFFACD;
    --coral: #FF7F7F;
    --text: #5C4B51;
  }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--lavender);
    overflow: hidden;
    height: 100vh;
    display: flex;
  }

  /* Sidebar */
  .sidebar {
    width: 380px;
    background: white;
    box-shadow: 4px 0 20px rgba(255, 182, 193, 0.3);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }

  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--pink); border-radius: 10px; }

  /* Header */
  .header {
    background: linear-gradient(135deg, var(--pink), var(--peach));
    padding: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '🌈 ✨ 🐱 🌸 🎀';
    position: absolute;
    bottom: 5px;
    left: 0;
    right: 0;
    font-size: 14px;
    opacity: 0.6;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .header h1 {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 28px;
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
    margin-bottom: 4px;
  }
  .header .subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    margin-bottom: 12px;
  }

  /* Search */
  .search-box {
    display: flex;
    gap: 8px;
    padding: 0 20px;
    background: white;
    position: relative;
    z-index: 2;
  }
  .search-box input {
    flex: 1;
    padding: 10px 16px;
    border: 3px solid var(--pink);
    border-radius: 25px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: all 0.3s;
    background: white;
  }
  .search-box input:focus {
    border-color: var(--coral);
    box-shadow: 0 0 15px rgba(255, 182, 193, 0.4);
  }
  .search-box button {
    padding: 10px 20px;
    background: linear-gradient(135deg, var(--pink), var(--coral));
    border: none;
    border-radius: 25px;
    color: white;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .search-box button:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(255, 127, 127, 0.4);
  }

  /* Quick lines */
  .quick-lines {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    flex-wrap: wrap;
  }
  .quick-lines .tag {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.3s;
    border: 2px solid transparent;
    font-family: inherit;
  }
  .tag-510 { background: #FFE4E1; border-color: var(--pink); color: var(--coral); }
  .tag-985 { background: #E0F7FA; border-color: var(--sky); color: #0288D1; }
  .tag-233 { background: #F3E5F5; border-color: #CE93D8; color: #7B1FA2; }
  .tag-69 { background: #FFF9C4; border-color: #FFD54F; color: #F57F17; }
  .tag-71 { background: #E8F5E9; border-color: var(--mint); color: #388E3C; }

  /* Route info card */
  .route-card {
    margin: 12px 20px;
    padding: 16px;
    background: linear-gradient(135deg, #FFf5f5, #FFF0F5);
    border-radius: 20px;
    border: 2px solid var(--pink);
    display: none;
  }
  .route-card.active { display: block; animation: cardIn 0.4s ease-out; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .route-card .route-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .route-card .route-info {
    font-size: 13px;
    color: #999;
    margin-bottom: 10px;
  }

  /* Bus cards */
  .bus-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 300px;
    overflow-y: auto;
  }
  .bus-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: white;
    border-radius: 16px;
    border: 2px solid #FFE4E1;
    transition: all 0.3s;
    cursor: pointer;
  }
  .bus-item:hover {
    border-color: var(--pink);
    box-shadow: 0 2px 10px rgba(255,182,193,0.3);
    transform: translateX(3px);
  }
  .bus-icon {
    font-size: 30px;
    animation: bounce 0.8s ease-in-out infinite;
  }
  .bus-icon.paused { animation: none; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .bus-detail { flex: 1; }
  .bus-detail .stop-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
  }
  .bus-detail .arrival {
    font-size: 12px;
    color: #999;
  }
  .bus-eta {
    font-size: 24px;
    font-weight: 700;
    font-family: 'ZCOOL KuaiLe', cursive;
    color: var(--coral);
    min-width: 60px;
    text-align: center;
  }

  /* Stops list */
  .stops-section {
    padding: 0 20px;
    margin-top: 8px;
  }
  .stops-section h3 {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stop-item {
    display: flex;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px dashed #FFE4E1;
    font-size: 13px;
    color: #666;
    cursor: pointer;
    transition: all 0.2s;
  }
  .stop-item:hover {
    color: var(--coral);
    padding-left: 4px;
  }
  .stop-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--mint);
    margin-right: 10px;
    flex-shrink: 0;
  }
  .stop-item.here .stop-dot {
    background: var(--coral);
    width: 12px;
    height: 12px;
    box-shadow: 0 0 8px rgba(255,127,127,0.5);
  }

  /* Map container */
  .map-container {
    flex: 1;
    position: relative;
  }
  #map {
    width: 100%;
    height: 100%;
  }

  /* Footer */
  .footer {
    padding: 12px 20px;
    text-align: center;
    font-size: 12px;
    color: #ccc;
    background: white;
    border-top: 1px solid #FFE4E1;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 30px;
    color: #ccc;
    font-size: 14px;
  }
  .loading .spinner {
    display: inline-block;
    width: 30px;
    height: 30px;
    border: 3px solid var(--pink);
    border-top: 3px solid transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 12px 24px;
    border-radius: 25px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    z-index: 9999;
    font-size: 14px;
    display: none;
    border: 2px solid var(--pink);
  }
  .toast.show { display: block; animation: toastIn 0.3s ease-out; }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* Mobile responsive */
  @media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; max-height: 45vh; }
    .map-container { flex: 1; min-height: 55vh; }
  }
</style>
</head>
<body>

<div class="sidebar">

    <h1>🚌 上海公交小可爱</h1>
    <div class="subtitle">pasteL BuS tRackEr ~ 🌸</div>
  </div>

  <div class="search-box">
    <input type="text" id="busSearch" placeholder="输入线路号，比如 510..."

    <span class="tag tag-233" onclick="quickSearch('233')">233路</span>
    <span class="tag tag-69" onclick="quickSearch('69')">69路</span>
    <span class="tag tag-71" onclick="quickSearch('71')">71路</span>

  <div class="route-card" id="routeCard">
    <div class="route-name" id="routeName">—</div>
    <div class="route-info" id="routeInfo">—</div>
    <div class="bus-list" id="busList">
      <div class="loading"><div class="spinner"></div><br>正在找车车~ 🚌</div>
    </div>
  </div>

  <div class="stops-section" id="stopsSection" style="display:none">
    <h3>🌸 途经站点</h3>
    <div id="stopsList"></div>
  </div>

  <div class="footer">
    🐱 公交迷の小天地 · 数据来自上海市实时公交

</div>

<div class="map-container">
  <div id="map"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

// Map stops that have bus presence
function updateRouteDisplay(routeKey) {
  const route = ROUTE_DB[routeKey];
  if (!route) return;

  currentRoute = route;

  // Update card
  document.getElementById('routeName').textContent = route.name;
  document.getElementById('routeInfo').textContent = `${route.from} ➜ ${route.to}`;

  // Update buses
  const busList = document.getElementById('busList');
  if (route.buses.length === 0) {
    busList.innerHTML = '<div class="loading">🐱 暂时没有运行中的车辆~</div>';
  } else {
    busList.innerHTML = route.buses.map(b => `
      <div class="bus-item" onclick="flyToBus('${b.id}')">
        <span class="bus-icon">🚌</span>
        <div class="bus-detail">
          <div class="stop-name">${b.stop}</div>
          <div class="arrival">${route.name} · 往${route.to}</div>
        </div>
        <div class="bus-eta">${b.eta}</div>
      </div>
    `).join('');
  }

  // Update stops
  const stopsSection = document.getElementById('stopsSection');
  const stopsList = document.getElementById('stopsList');
  stopsList.innerHTML = route.stops.map((s, i) => {
    const hasBus = route.buses.some(b => b.stop === s.name);
    return `
      <div class="stop-item ${hasBus ? 'here' : ''}" onclick="map.setView([${s.lat}, ${s.lng}], 15)">
        <span class="stop-dot"></span>
        <span>${s.name}${hasBus ? ' 🚌' : ''}</span>
        ${i === 0 ? '<span style="margin-left:auto;font-size:11px;color:var(--mint)">起点</span>' : ''}
        ${i === route.stops.length-1 ? '<span style="margin-left:auto;font-size:11px;color:var(--pink)">终点</span>' : ''}
      </div>
    `;
  }).join('');
  stopsSection.style.display = 'block';
  document.getElementById('routeCard').classList.add('active');

  // Update map
  updateMap(route);
}

function updateMap(route) {
  // Clear old markers and line
  busMarkers.forEach(m => map.removeLayer(m));
  busMarkers = [];
  if (routePolyline) map.removeLayer(routePolyline);

  // Draw route line
  const coords = route.stops.map(s => [s.lat, s.lng]);
  routePolyline = L.polyline(coords, {
    color: route.color,
    weight: 4,
    opacity: 0.7,
    dashArray: '10, 5'
  }).addTo(map);

  // Add stop markers
  route.stops.forEach((s, i) => {
    const isBusHere = route.buses.some(b => b.stop === s.name);
    const color = i === 0 ? '#4CAF50' : (i === route.stops.length-1 ? '#F44336' : (isBusHere ? route.color : '#BDBDBD'));
    const size = isBusHere ? 10 : 6;

    const marker = L.circleMarker([s.lat, s.lng], {
      radius: size,
      fillColor: color,
      color: '#fff',
      weight: 2,
      fillOpacity: 1
    }).addTo(map);

    marker.bindTooltip(`<b>${s.name}</b><br>${route.name} · 第${i+1}站`, {
      direction: 'top',
      offset: [0, -size-5]
    });

    busMarkers.push(marker);
  });

  // Add bus markers
  route.buses.forEach(b => {
    const busIcon = L.divIcon({
      className: 'custom-bus-marker',
      html: '<div style="font-size:28px;filter:drop-shadow(2px 2px 2px rgba(0,0,0,0.3));animation:bounce 0.6s ease-in-out infinite">🚌</div>',
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });

    const marker = L.marker([b.lat, b.lng], { icon: busIcon }).addTo(map);
    marker.bindPopup(`<b>${route.name}</b><br>📍 ${b.stop}<br>⏰ 预计 ${b.eta}`);

    busMarkers.push(marker);
  });

  // Fit map to route
  map.fitBounds(coords, { padding: [50, 50] });
}

// ============ Search ============
function searchBus() {
  const query = document.getElementById('busSearch').value.trim();
  if (!query) return toast('请先输入线路号哦~ 🐱');

  // Try exact match
  if (ROUTE_DB[query]) {
    updateRouteDisplay(query);
    toast(`找到啦！${ROUTE_DB[query].name} 🌸`);
    return;
  }

  // Try fuzzy match
  for (const [key, route] of Object.entries(ROUTE_DB)) {
    if (key.includes(query) || route.name.includes(query)) {
      updateRouteDisplay(key);
      toast(`找到啦！${route.name} 🌸`);
      return;
    }
  }

  // Try AMap API for unknown routes
  toast('正在联网查询... 🔍');
  fetch(`https://restapi.amap.com/v3/bus/linename?s=rsv3&extensions=all&key=${AMAP_KEY}&output=json&city=上海&offset=1&keywords=${encodeURIComponent(query)}`)
    .then(r => r.json())
    .then(data => {
      if (data.status === '1' && data.buslines && data.buslines.length > 0) {
        const line = data.buslines[0];
        const routeKey = query;

        // Build route data from API
        const stops = line.busstops.map(s => ({
          name: s.name,
          lat: parseFloat(s.location.split(',')[1]),
          lng: parseFloat(s.location.split(',')[0])
        }));

        ROUTE_DB[routeKey] = {
          name: line.name,
          from: line.start_stop,
          to: line.end_stop,
          color: '#' + Math.floor(Math.random()*16777215).toString(16).padStart(6,'0'),
          stops: stops,
          buses: []
        };

        // Try to get real-time buses
        fetch(`https://restapi.amap.com/v3/bus/realtime?key=${AMAP_KEY}&output=json&city=上海&extensions=all&buslineid=${line.id}`)
          .then(r => r.json())
          .then(rt => {
            if (rt.status === '1' && rt.data && rt.data.buses) {
              ROUTE_DB[routeKey].buses = rt.data.buses.map((b, i) => ({
                id: `${routeKey}-${i}`,
                stop: b.stopname || stops[Math.floor(stops.length * Math.random())]?.name || '运营中',
                eta: b.arrivaltime ? (b.arrivaltime + '分钟') : '未知',
                lat: parseFloat(b.location.split(',')[1]),
                lng: parseFloat(b.location.split(',')[0])
              }));
            }
            updateRouteDisplay(routeKey);
            toast(`联网查到啦！${line.name} 🌸`);
          })
          .catch(() => {
            updateRouteDisplay(routeKey);
            toast(`找到线路 ${line.name}，实时车辆暂时查不到~ 🐱`);
          });
      } else {
        toast('没找到这条线路哦 😿 试试其他线路？');
      }
    })
    .catch(() => {
      toast('网络不太好，试试快捷线路吧~ 🌐');
    });
}

function quickSearch(key) {
  document.getElementById('busSearch').value = key;
  searchBus();
}

function flyToBus(busId) {
  // Find bus and fly to it
  for (const [key, route] of Object.entries(ROUTE_DB)) {
    const bus = route.buses.find(b => b.id === busId);
    if (bus) {
      map.setView([bus.lat, bus.lng], 15, { animate: true });
      break;
    }
  }
}

// ============ Toast ============
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============ Init ============
// Load 510 by default
setTimeout(() => updateRouteDisplay('510'), 500);
</script>
