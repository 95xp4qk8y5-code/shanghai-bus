<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚌 上海公交小可爱</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;700&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --pink: #FFB6C1;
    --mint: #98FB98;
    --sky: #87CEEB;
    --peach: #FFDAB9;
    --lavender: #E6E6FA;
    --yellow: #FFFACD;
    --coral: #FF7F7F;
    --text: #5C4B51;
  }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: var(--lavender);
    overflow: hidden;
    height: 100vh; height: 100dvh;
    display: flex;
  }

  .sidebar {
    width: 380px;
    background: white;
    box-shadow: 4px 0 20px rgba(255, 182, 193, 0.3);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex-shrink: 0;
  }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--pink); border-radius: 10px; }

  .header {
    background: linear-gradient(135deg, var(--pink), var(--peach));
    padding: 20px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::after {
    content: '🌈 ✨ 🐱 🌸 🎀';
    position: absolute;
    bottom: 5px;
    left: 0; right: 0;
    font-size: 14px;
    opacity: 0.6;
  }
  .header h1 {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 28px;
    color: white;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
    margin-bottom: 4px;
  }
  .header .subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.85);
    margin-bottom: 12px;
  }

  .search-box {
    display: flex;
    gap: 8px;
    padding: 0 20px;
  }
  .search-box input {
    flex: 1;
    padding: 10px 16px;
    border: 3px solid var(--pink);
    border-radius: 25px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: all 0.3s;
  }
  .search-box input:focus {
    border-color: var(--coral);
    box-shadow: 0 0 15px rgba(255, 182, 193, 0.4);
  }
  .search-box button {
    padding: 10px 20px;
    background: linear-gradient(135deg, var(--pink), var(--coral));
    border: none;
    border-radius: 25px;
    color: white;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s;
    white-space: nowrap;
  }
  .search-box button:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(255, 127, 127, 0.4);
  }

  .quick-lines {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    flex-wrap: wrap;
  }
  .quick-lines .tag {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.3s;
    border: 2px solid transparent;
    font-family: inherit;
  }
  .tag-510 { background: #FFE4E1; border-color: var(--pink); color: var(--coral); }
  .tag-985 { background: #E0F7FA; border-color: var(--sky); color: #0288D1; }
  .tag-233 { background: #F3E5F5; border-color: #CE93D8; color: #7B1FA2; }
  .tag-69 { background: #FFF9C4; border-color: #FFD54F; color: #F57F17; }
  .tag-71 { background: #E8F5E9; border-color: var(--mint); color: #388E3C; }

  .route-card {
    margin: 12px 20px;
    padding: 16px;
    background: linear-gradient(135deg, #FFF5F5, #FFF0F5);
    border-radius: 20px;
    border: 2px solid var(--pink);
    display: none;
  }
  .route-card.active { display: block; animation: cardIn 0.4s ease-out; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .route-card .route-name {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .route-card .route-info {
    font-size: 13px;
    color: #999;
    margin-bottom: 10px;
  }

  .bus-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 300px;
    overflow-y: auto;
  }
  .bus-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: white;
    border-radius: 16px;
    border: 2px solid #FFE4E1;
    transition: all 0.3s;
    cursor: pointer;
  }
  .bus-item:hover {
    border-color: var(--pink);
    box-shadow: 0 2px 10px rgba(255,182,193,0.3);
    transform: translateX(3px);
  }
  .bus-icon { font-size: 30px; }
  .bus-detail { flex: 1; }
  .bus-detail .stop-name { font-size: 14px; font-weight: 700; color: var(--text); }
  .bus-detail .arrival { font-size: 12px; color: #999; }
  .bus-eta {
    font-size: 24px;
    font-weight: 700;
    font-family: 'ZCOOL KuaiLe', cursive;
    color: var(--coral);
    min-width: 60px;
    text-align: center;
  }

  .stops-section {
    padding: 0 20px;
    margin-top: 8px;
    margin-bottom: 12px;
  }
  .stops-section h3 {
    font-size: 14px;
    color: var(--text);
    margin-bottom: 8px;
  }
  .stop-item {
    display: flex;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px dashed #FFE4E1;
    font-size: 13px;
    color: #666;
    cursor: pointer;
    transition: all 0.2s;
  }
  .stop-item:hover { color: var(--coral); padding-left: 4px; }
  .stop-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--mint);
    margin-right: 10px;
    flex-shrink: 0;
  }
  .stop-item.here .stop-dot {
    background: var(--coral);
    width: 12px; height: 12px;
    box-shadow: 0 0 8px rgba(255,127,127,0.5);
  }

  .map-container { flex: 1; position: relative; min-width: 0; }
  #map { width: 100%; height: 100%; }

  .footer {
    padding: 12px 20px;
    text-align: center;
    font-size: 12px;
    color: #ccc;
    background: white;
    border-top: 1px solid #FFE4E1;
    flex-shrink: 0;
  }

  .loading {
    text-align: center;
    padding: 30px;
    color: #ccc;
    font-size: 14px;
  }
  .loading .spinner {
    display: inline-block;
    width: 30px; height: 30px;
    border: 3px solid var(--pink);
    border-top: 3px solid transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 12px 24px;
    border-radius: 25px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    z-index: 9999;
    font-size: 14px;
    display: none;
    border: 2px solid var(--pink);
  }
  .toast.show { display: block; animation: toastIn 0.3s ease-out; }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  @media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; max-height: 42vh; }
    .map-container { flex: 1; min-height: 58vh; }
  }
</style>
</head>
<body>

<div class="sidebar">
  <div class="header">
    <h1>🚌 上海公交小可爱</h1>
    <div class="subtitle">pasteL BuS tRackEr ~ 🌸</div>
  </div>

  <div class="search-box">
    <input type="text" id="busSearch" placeholder="输入线路号，比如 510..."
           onkeydown="if(event.key==='Enter')searchBus()">
    <button onclick="searchBus()">🔍 查车</button>
  </div>

  <div class="quick-lines">
    <span class="tag tag-510" onclick="quickSearch('510')">510路</span>
    <span class="tag tag-985" onclick="quickSearch('985')">985路</span>
    <span class="tag tag-233" onclick="quickSearch('233')">233路</span>
    <span class="tag tag-69" onclick="quickSearch('69')">69路</span>
    <span class="tag tag-71" onclick="quickSearch('71')">71路</span>
    <span class="tag" style="background:#FFF3E0;border-color:#FFCC80;color:#E65100;" onclick="quickSearch('南堡支线')">南堡支线</span>
  </div>

  <div class="route-card active" id="routeCard">
    <div class="route-name" id="routeName">—</div>
    <div class="route-info" id="routeInfo">—</div>
    <div class="bus-list" id="busList">
      <div class="loading"><div class="spinner"></div><br>正在找车车~ 🚌</div>
    </div>
  </div>

  <div class="stops-section" id="stopsSection" style="display:none">
    <h3>🌸 途经站点</h3>
    <div id="stopsList"></div>
  </div>

  <div class="footer">
    🐱 公交迷の小天地 · 数据来自高德地图实时公交
  </div>
</div>

<div class="map-container">
  <div id="map"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ============ Config ============
const AMAP_KEY = '1c6391e097e980e9d0a251d870395352';
const SH_CENTER = [31.2304, 121.4737];

// ============ Map ============
const map = L.map('map', {
  center: SH_CENTER,
  zoom: 13,
  zoomControl: false
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OSM',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

L.control.zoom({ position: 'bottomright' }).addTo(map);

// ============ State ============
let busMarkers = [];
let routePolyline = null;
let currentRoute = null;

const ROUTE_COLORS = ['#FF7F7F','#87CEEB','#CE93D8','#FFD54F','#388E3C','#E65100','#FF80AB','#80DEEA','#B39DDB'];

// ============ Build route from AMap API ============
function fetchAndDisplay(query) {
  document.getElementById('routeCard').classList.add('active');
  document.getElementById('routeName').textContent = '查询中...';
  document.getElementById('routeInfo').textContent = '';
  document.getElementById('busList').innerHTML = '<div class="loading"><div class="spinner"></div><br>正在联网查询~ 🌐</div>';
  document.getElementById('stopsSection').style.display = 'none';

  // Step 1: Get bus line info
  const url1 = `https://restapi.amap.com/v3/bus/linename?s=rsv3&extensions=all&key=${AMAP_KEY}&output=json&city=上海&offset=1&keywords=${encodeURIComponent(query)}`;
  
  fetch(url1)
    .then(r => r.json())
    .then(data => {
      if (data.status !== '1' || !data.buslines || data.buslines.length === 0) {
        document.getElementById('routeName').textContent = '没找到 😿';
        document.getElementById('busList').innerHTML = '<div class="loading">这条线路不存在，试试其他线路吧~ 🐱</div>';
        return;
      }

      const line = data.buslines[0];
      const color = ROUTE_COLORS[Math.floor(Math.random() * ROUTE_COLORS.length)];

      // Build stops from API
      const stops = (line.busstops || []).map(s => ({
        name: s.name,
        lat: parseFloat(s.location.split(',')[1]),
        lng: parseFloat(s.location.split(',')[0])
      }));

      // Update UI
      document.getElementById('routeName').textContent = line.name;
      document.getElementById('routeInfo').textContent = `${line.start_stop} ➜ ${line.end_stop} · 首班${line.start_time || '?'} 末班${line.end_time || '?'}`;

      // Step 2: Get real-time buses
      const id = line.id || line.virtual_bus_id || '';
      const url2 = `https://restapi.amap.com/v3/bus/realtime?key=${AMAP_KEY}&output=json&city=上海&extensions=all&buslineid=${id}`;

      fetch(url2)
        .then(r => r.json())
        .then(rt => {
          let buses = [];
          if (rt.status === '1' && rt.data && rt.data.buses) {
            buses = rt.data.buses.map((b, i) => ({
              id: `${query}-${i}`,
              stop: b.stopname || '运营中',
              eta: b.arrivaltime != null ? (b.arrivaltime + '分钟') : '—',
              lat: b.location ? parseFloat(b.location.split(',')[1]) : null,
              lng: b.location ? parseFloat(b.location.split(',')[0]) : null
            }));
          }

          // Find which stops have buses nearby
          const busStops = new Set(buses.map(b => b.stop));

          // Render buses
          const busList = document.getElementById('busList');
          if (buses.length === 0) {
            busList.innerHTML = '<div class="loading">🐱 暂无运行动态，可能是末班车已过~</div>';
          } else {
            busList.innerHTML = buses.map(b => `
              <div class="bus-item" onclick="flyToBus(${b.lat},${b.lng})">
                <span class="bus-icon">🚌</span>
                <div class="bus-detail">
                  <div class="stop-name">${b.stop}</div>
                  <div class="arrival">${line.name} · 往${line.end_stop}</div>
                </div>
                <div class="bus-eta">${b.eta}</div>
              </div>
            `).join('');
          }

          // Render stops
          const stopsSection = document.getElementById('stopsSection');
          const stopsList = document.getElementById('stopsList');
          stopsList.innerHTML = stops.map((s, i) => {
            const hasBus = busStops.has(s.name);
            return `
              <div class="stop-item ${hasBus ? 'here' : ''}" onclick="map.setView([${s.lat},${s.lng}], 16)">
                <span class="stop-dot"></span>
                <span>${s.name}${hasBus ? ' 🚌' : ''}</span>
                ${i === 0 ? '<span style="margin-left:auto;font-size:11px;color:var(--mint)">起点</span>' : ''}
                ${i === stops.length-1 ? '<span style="margin-left:auto;font-size:11px;color:var(--pink)">终点</span>' : ''}
              </div>
            `;
          }).join('');
          stopsSection.style.display = 'block';

          // Update map
          updateMap(stops, buses, color, line);

          toast(`找到 ${line.name}，${buses.length}辆车运行中 🌸`);
        })
        .catch(() => {
          document.getElementById('busList').innerHTML = '<div class="loading">实时数据暂时获取不到~ 🐱</div>';
          const stopsSection = document.getElementById('stopsSection');
          const stopsList = document.getElementById('stopsList');
          stopsList.innerHTML = stops.map((s, i) => `
            <div class="stop-item" onclick="map.setView([${s.lat},${s.lng}], 16)">
              <span class="stop-dot"></span>
              <span>${s.name}</span>
              ${i === 0 ? '<span style="margin-left:auto;font-size:11px;color:var(--mint)">起点</span>' : ''}
              ${i === stops.length-1 ? '<span style="margin-left:auto;font-size:11px;color:var(--pink)">终点</span>' : ''}
            </div>
          `).join('');
          stopsSection.style.display = 'block';
          updateMap(stops, [], color, line);
        });
    })
    .catch(e => {
      document.getElementById('routeName').textContent = '网络错误 😿';
      document.getElementById('busList').innerHTML = '<div class="loading">网络不太好，刷新试试~ 🌐</div>';
      console.error(e);
    });
}

// ============ Map rendering ============
function updateMap(stops, buses, color, line) {
  busMarkers.forEach(m => map.removeLayer(m));
  busMarkers = [];
  if (routePolyline) map.removeLayer(routePolyline);

  const coords = stops.map(s => [s.lat, s.lng]);
  routePolyline = L.polyline(coords, {
    color: color,
    weight: 5,
    opacity: 0.6,
    dashArray: '12, 8'
  }).addTo(map);

  // Stop markers
  const busStopNames = new Set(buses.map(b => b.stop));
  stops.forEach((s, i) => {
    const hasBus = busStopNames.has(s.name);
    const c = i === 0 ? '#4CAF50' : (i === stops.length-1 ? '#F44336' : (hasBus ? color : '#BDBDBD'));
    const r = hasBus ? 9 : 5;

    const m = L.circleMarker([s.lat, s.lng], {
      radius: r, fillColor: c, color: '#fff', weight: 2, fillOpacity: 1
    }).addTo(map);
    m.bindTooltip(`<b>${s.name}</b><br>${line.name}`, { direction: 'top', offset: [0, -r-5] });
    busMarkers.push(m);
  });

  // Bus markers
  buses.forEach(b => {
    if (!b.lat || !b.lng) return;
    const icon = L.divIcon({
      className: '',
      html: '<div style="font-size:32px;filter:drop-shadow(2px 2px 2px rgba(0,0,0,0.3));animation:bounce 0.6s ease-in-out infinite">🚌</div>',
      iconSize: [40, 40],
      iconAnchor: [20, 20]
    });
    const m = L.marker([b.lat, b.lng], { icon }).addTo(map);
    m.bindPopup(`<b>${line.name}</b><br>📍 ${b.stop}<br>⏰ 预计 ${b.eta}`);
    busMarkers.push(m);
  });

  map.fitBounds(coords.length > 1 ? coords : [[coords[0][0]-0.01, coords[0][1]-0.01], [coords[0][0]+0.01, coords[0][1]+0.01]], { padding: [50, 50] });
}

function flyToBus(lat, lng) {
  if (lat && lng) map.setView([lat, lng], 15, { animate: true });
}

function searchBus() {
  const q = document.getElementById('busSearch').value.trim();
  if (!q) return toast('请输入线路号~ 🐱');
  fetchAndDisplay(q);
}

function quickSearch(k) {
  document.getElementById('busSearch').value = k;
  fetchAndDisplay(k);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============ Init ============
setTimeout(() => fetchAndDisplay('510'), 600);
</script>
</body>
</html>
