<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🚌 上海公交小可爱</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --pink: #FFB6C1; --mint: #98FB98; --coral: #FF7F7F; --text: #5C4B51; }
  body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #E6E6FA;
    overflow: hidden;
    height: 100vh; height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .top-bar {
    background: linear-gradient(135deg, #FFB6C1, #FFDAB9);
    padding: 14px 16px;
    text-align: center;
    flex-shrink: 0;
  }
  .top-bar h1 { font-size: 22px; color: white; text-shadow: 1px 1px 3px rgba(0,0,0,0.1); }

  .search-row {
    display: flex;
    gap: 8px;
    padding: 8px 16px;
    background: white;
    flex-shrink: 0;
  }
  .search-row input {
    flex: 1;
    padding: 10px 14px;
    border: 2px solid #FFB6C1;
    border-radius: 20px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }
  .search-row button {
    padding: 10px 18px;
    background: #FF7F7F;
    border: none;
    border-radius: 20px;
    color: white;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
  }
  .search-row button:active { opacity: 0.8; }

  .tags-row {
    display: flex;
    gap: 6px;
    padding: 6px 16px;
    background: white;
    flex-wrap: wrap;
    flex-shrink: 0;
    border-bottom: 1px solid #FFE4E1;
  }
  .tags-row span {
    padding: 4px 12px;
    border-radius: 15px;
    font-size: 13px;
    border: 1.5px solid #ddd;
    cursor: pointer;
    user-select: none;
    background: white;
  }
  .tags-row span:active { background: #FFE4E1; }

  .info-panel {
    padding: 10px 16px;
    background: white;
    flex-shrink: 0;
    max-height: 40vh;
    overflow-y: auto;
    border-top: 1px solid #FFE4E1;
    display: none;
  }
  .info-panel.show { display: block; }

  .route-title { font-size: 17px; font-weight: 700; color: var(--text); }
  .route-meta { font-size: 13px; color: #999; margin: 2px 0 8px; }

  .stop-row {
    display: flex;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px dashed #FFE4E1;
    font-size: 13px;
    color: #666;
    cursor: pointer;
  }
  .stop-row:active { background: #FFF5F5; }
  .stop-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #98FB98;
    margin-right: 8px;
    flex-shrink: 0;
  }
  .stop-row.bus-here .stop-dot { background: #FF7F7F; width: 10px; height: 10px; }

  .bus-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    background: #FFF0F0;
    border-radius: 12px;
    font-size: 12px;
    color: #FF7F7F;
    margin: 2px 4px;
    cursor: pointer;
  }

  .map-wrap { flex: 1; position: relative; min-height: 0; }
  #map { width: 100%; height: 100%; }

  .status-bar {
    padding: 6px 16px;
    text-align: center;
    font-size: 11px;
    color: #bbb;
    background: white;
    flex-shrink: 0;
  }

  .loading-text {
    text-align: center;
    padding: 15px;
    color: #ccc;
    font-size: 13px;
  }

  .toast {
    position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    padding: 10px 20px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    z-index: 9999;
    font-size: 14px;
    display: none;
    border: 2px solid #FFB6C1;
    pointer-events: none;
  }
  .toast.on { display: block; }

  @media (min-width: 769px) {
    body { flex-direction: row; }
    .top-bar, .search-row, .tags-row, .info-panel, .status-bar { display: none; }
    body::before {
      content: '';
      width: 360px;
      flex-shrink: 0;
      background: white;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      box-shadow: 2px 0 15px rgba(255,182,193,0.2);
    }
  }
</style>
</head>
<body>

<div class="top-bar"><h1>🚌 上海公交小可爱</h1></div>

<div class="search-row">
  <input type="text" id="q" placeholder="输入线路号，如 510路...">
  <button onclick="go()">🔍</button>
</div>

<div class="tags-row">
  <span onclick="goTag('510路')">510路</span>
  <span onclick="goTag('985路')">985路</span>
  <span onclick="goTag('233路')">233路</span>
  <span onclick="goTag('69路')">69路</span>
  <span onclick="goTag('71路')">71路</span>
  <span onclick="goTag('南堡支线')">南堡支线</span>
  <span onclick="goTag('112路')">112路</span>
  <span onclick="goTag('63路')">63路</span>
</div>

<div class="info-panel" id="info">
  <div class="route-title" id="rname">—</div>
  <div class="route-meta" id="rmeta">—</div>
  <div id="buses"></div>
  <div id="stops"></div>
</div>

<div class="map-wrap"><div id="map"></div></div>
<div class="status-bar">🐱 数据来自 OpenStreetMap + 高德公交 · 🌸</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ============ Map ============
const map = L.map('map', {
  center: [31.2304, 121.4737],
  zoom: 13,
  zoomControl: true,
  zoomControlPos: 'bottomright'
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '© OSM',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// Shanghai bounds
const SH_BOUNDS = L.latLngBounds([[30.68, 120.85], [31.53, 121.97]]);

let markers = [];
let polyline = null;
let currentStops = [];

function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.className = 'toast on';
  setTimeout(() => t.className = 'toast', 2000);
}

// ============ Search ============
function go() {
  const q = document.getElementById('q').value.trim();
  if (!q) return toast('输入线路号~ 🐱');
  document.getElementById('info').classList.add('show');
  document.getElementById('rname').textContent = '🔍 查询中...';
  document.getElementById('rmeta').textContent = '';
  document.getElementById('buses').innerHTML = '';
  document.getElementById('stops').innerHTML = '<div class="loading-text">⏳ 搜索中...</div>';
  searchOSM(q);
}

function goTag(k) {
  document.getElementById('q').value = k;
  go();
}

// ============ OSM Overpass Search ============
function searchOSM(query) {
  const keyword = query.replace(/[^0-9a-zA-Z\u4e00-\u9fa5]/g, '').replace('路','');

  // Build Overpass query
  const q = `[out:json][timeout:15];
area["name"="上海市"]->.sh;
(
  relation["route"="bus"]["ref"~"^${keyword}"](area.sh);
  relation["route"="bus"]["name"~"${keyword}"](area.sh);
);
out body;
>; out skel qt;`;

  fetch('https://overpass-api.de/api/interpreter', {
    method: 'POST',
    body: 'data=' + encodeURIComponent(q),
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
  })
  .then(r => r.json())
  .then(data => {
    const nodes = {};
    data.elements.forEach(e => {
      if (e.type === 'node') nodes[e.id] = [e.lat, e.lon];
    });

    const relations = data.elements.filter(e => e.type === 'relation');
    if (relations.length === 0) {
      document.getElementById('rname').textContent = '没找到 😿';
      document.getElementById('stops').innerHTML = '<div class="loading-text">OSM 暂无此线路，试试高德查询~</div>';
      tryAMap(query);
      return;
    }

    // Pick the first relation
    const rel = relations[0];
    const tags = rel.tags || {};
    const members = rel.members || [];

    // Get stops
    const stopMembers = members.filter(m => m.role && m.role.includes('stop') || m.role === 'platform');
    const stops = stopMembers.map(m => ({
      name: tags[`stop_${m.role === 'platform' ? stopMembers.indexOf(m) : ''}`] || `站点`,
      lat: nodes[m.ref] ? nodes[m.ref][0] : null,
      lng: nodes[m.ref] ? nodes[m.ref][1] : null,
      role: m.role
    }));

    // Get ways for polyline
    const wayMembers = members.filter(m => m.type === 'way' && !m.role);
    const coords = [];
    wayMembers.forEach(w => {
      const wNodes = w.ref ? [] : [];
    });
    const allCoords = stops.filter(s => s.lat).map(s => [s.lat, s.lng]);

    currentStops = stops.filter(s => s.lat);

    // Display
    const name = tags.name || (keyword + '路');
    const from = tags.from || '—';
    const to = tags.to || '—';
    
    document.getElementById('rname').textContent = '🚌 ' + name;
    document.getElementById('rmeta').textContent = `${from} ➜ ${to}`;

    // Stops list
    document.getElementById('stops').innerHTML = currentStops.map((s, i) => `
      <div class="stop-row" onclick="map.setView([${s.lat},${s.lng}], 16)">
        <span class="stop-dot"></span>
        <span>${s.name || '站点' + (i+1)}</span>
        ${i===0?'<span style="margin-left:auto;font-size:10px;color:#4CAF50">起</span>':''}
        ${i===currentStops.length-1?'<span style="margin-left:auto;font-size:10px;color:#F44336">终</span>':''}
      </div>
    `).join('');

    // Map
    drawMap(currentStops, [], allCoords.length > 1 ? allCoords : currentStops);
    
    // Also try AMap for real-time
    tryAMapRealtime(keyword);
  })
  .catch(e => {
    console.error('OSM error:', e);
    document.getElementById('rname').textContent = 'OSM 查询失败';
    tryAMap(query);
  });
}

function tryAMap(query) {
  const keyword = query.replace(/[^0-9a-zA-Z\u4e00-\u9fa5]/g, '');
  // Use corsproxy to access AMap
  const amapUrl = `https://restapi.amap.com/v3/bus/linename?s=rsv3&extensions=all&key=1c6391e097e980e9d0a251d870395352&output=json&city=上海&offset=1&keywords=${encodeURIComponent(keyword)}`;
  
  fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(amapUrl))
    .then(r => r.json())
    .then(data => {
      if (data.status !== '1' || !data.buslines || !data.buslines.length) {
        document.getElementById('stops').innerHTML += '<div class="loading-text">高德也未找到 😿</div>';
        return;
      }
      const line = data.buslines[0];
      const stops = (line.busstops || []).map(s => ({
        name: s.name,
        lat: parseFloat(s.location.split(',')[1]),
        lng: parseFloat(s.location.split(',')[0])
      }));

      document.getElementById('rname').textContent = '🚌 ' + line.name;
      document.getElementById('rmeta').textContent = `${line.start_stop} ➜ ${line.end_stop} · 首${line.start_time||'?'} 末${line.end_time||'?'}`;
      
      document.getElementById('stops').innerHTML = stops.map((s, i) => `
        <div class="stop-row" onclick="map.setView([${s.lat},${s.lng}], 16)">
          <span class="stop-dot"></span><span>${s.name}</span>
          ${i===0?'<span style="margin-left:auto;font-size:10px;color:#4CAF50">起</span>':''}
          ${i===stops.length-1?'<span style="margin-left:auto;font-size:10px;color:#F44336">终</span>':''}
        </div>
      `).join('');

      currentStops = stops;
      drawMap(stops, []);
      toast('🌸 ' + line.name + ' · ' + stops.length + '站');
    })
    .catch(() => {
      document.getElementById('stops').innerHTML += '<div class="loading-text">网络错误，请重试 😿</div>';
    });
}

function tryAMapRealtime(keyword) {
  // Not available without valid key
  document.getElementById('buses').innerHTML = '<div style="padding:6px;font-size:12px;color:#bbb;text-align:center">🚌 实时车辆需有效 API key</div>';
}

// ============ Draw Map ============
function drawMap(stops, buses, polyCoords) {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  if (polyline) map.removeLayer(polyline);

  const coords = polyCoords || stops;

  if (coords.length > 1) {
    polyline = L.polyline(coords, {
      color: '#FF9E9E',
      weight: 5,
      opacity: 0.5,
      dashArray: '10, 8'
    }).addTo(map);
  }

  stops.forEach((s, i) => {
    if (!s.lat || !s.lng) return;
    const color = i===0 ? '#4CAF50' : (i===stops.length-1 ? '#F44336' : '#BDBDBD');
    const m = L.circleMarker([s.lat, s.lng], {
      radius: 5,
      fillColor: color,
      color: '#fff',
      weight: 2,
      fillOpacity: 1
    }).addTo(map);
    m.bindTooltip(s.name || ('站点'+(i+1)), { direction: 'top' });
    markers.push(m);
  });

  if (coords.length > 1) {
    map.fitBounds(coords, { padding: [40, 40], maxZoom: 15 });
  } else if (coords.length === 1) {
    map.setView(coords[0], 15);
  }
}

// Init
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') go();
});
</script>
</body>
</html>
