<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🛫 AirSight - 实时航班追踪</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a1a;color:#e0e0e0;height:100vh;display:flex;flex-direction:column}
  header{background:linear-gradient(135deg,#1a1a3e,#0d0d2b);padding:10px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2a2a5a;z-index:1000;flex-shrink:0}
  header h1{font-size:1.2em;color:#00d4ff}
  header .stats{display:flex;gap:10px;margin-left:auto;font-size:0.8em}
  header .stats span{padding:3px 8px;background:#1a1a3e;border-radius:10px;border:1px solid #3a3a6a}
  header .stats .val{color:#00d4ff;font-weight:bold}
  .controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 16px;background:#0d0d24;border-bottom:1px solid #1a1a3e;flex-shrink:0}
  .controls select, .controls button{padding:4px 8px;border-radius:5px;border:1px solid #3a3a6a;background:#1a1a3e;color:#e0e0e0;font-size:0.8em;cursor:pointer}
  .controls button:hover{background:#2a2a5a}
  .controls button.active{background:#0055aa;border-color:#0088ff}
  .main{display:flex;flex:1;overflow:hidden}
  #map{flex:1;height:100%}
  .sidebar{width:360px;background:#0d0d24;border-left:1px solid #2a2a5a;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
  .sidebar-header{padding:8px 14px;border-bottom:1px solid #2a2a5a;display:flex;justify-content:space-between;align-items:center}
  .sidebar-header h3{font-size:0.85em;color:#888;font-weight:normal}
  .flight-list{flex:1;overflow-y:auto;padding:4px}
  .flight-card{background:#1a1a3e;border-radius:7px;padding:7px 10px;margin-bottom:4px;border-left:3px solid #3a3a6a;cursor:pointer;transition:all 0.15s;font-size:0.82em}
  .flight-card:hover{background:#25255a;border-left-color:#00d4ff}
  .flight-card.ground{opacity:0.4}
  .flight-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
  .flight-card .callsign{font-weight:bold;color:#fff}
  .flight-card .airline{color:#888;font-size:0.78em}
  .flight-card .info{display:flex;gap:8px;font-size:0.75em;color:#aaa}
  .alt-high{color:#ff6bff}.alt-cruise{color:#00d4ff}.alt-climb{color:#ffd700}.alt-low{color:#4cff4c}
  .time-badge{font-size:0.7em;color:#666}
  .leaflet-container{background:#0a0a1a}
  .leaflet-control-zoom a{background:#1a1a3e!important;color:#e0e0e0!important;border-color:#3a3a6a!important}
  .leaflet-popup-content-wrapper{background:#0d0d24;color:#e0e0e0;border:1px solid #2a2a5a;font-size:0.85em}
  .leaflet-popup-tip{background:#0d0d24}
  .status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
  .status-dot.ok{background:#4cff4c}
  .status-dot.err{background:#ff4444}
  @media(max-width:700px){.sidebar{width:100%;position:absolute;bottom:0;left:0;height:40%;z-index:999;border-top:1px solid #2a2a5a;border-left:none;display:none}
  .sidebar.open{display:flex}}
  .toggle-sidebar{display:none;position:absolute;bottom:10px;right:10px;z-index:1000;background:#1a1a3e;border:1px solid #3a3a6a;color:#e0e0e0;border-radius:8px;padding:8px 12px;font-size:0.85em;cursor:pointer}
  @media(max-width:700px){.toggle-sidebar{display:block}}
</style>
</head>
<body>

<header>
  <h1>🛫 AirSight</h1>
  <span style="font-size:0.7em;color:#555">ADS-B.lol</span>
  <div class="stats">
    <span>📡 <b class="val" id="stat-count">—</b></span>
    <span>✈️ <b class="val" id="stat-airborne">—</b></span>
    <span>🕐 <span id="stat-time">—</span></span>
  </div>
</header>

<div class="controls">
  <span style="font-size:0.8em;color:#888;">📍</span>
  <button onclick="setCenter('shanghai')" class="active" id="btn-shanghai">上海</button>
  <button onclick="setCenter('beijing')" id="btn-beijing">北京</button>
  <button onclick="setCenter('guangzhou')" id="btn-guangzhou">广州</button>
  <button onclick="setCenter('chengdu')" id="btn-chengdu">成都</button>
  <span style="margin-left:6px;font-size:0.8em;color:#888;">半径</span>
  <select id="radius-select" onchange="fetchData()">
    <option value="300">300nm</option>
    <option value="500" selected>500nm</option>
    <option value="800">800nm</option>
  </select>
  <span style="margin-left:6px;font-size:0.8em;color:#888;">航司</span>
  <select id="airline-filter" onchange="fetchData()">
    <option value="">全部</option>
    <option value="CES">东方航空</option>
    <option value="CSN">南方航空</option>
    <option value="CCA">国际航空</option>
    <option value="CQH">春秋航空</option>
    <option value="CXA">厦门航空</option>
  </select>
  <span style="margin-left:6px;font-size:0.8em;color:#888;">刷新</span>
  <select id="refresh-interval" onchange="changeInterval()">
    <option value="15">15秒</option>
    <option value="10" selected>10秒</option>
    <option value="5">5秒</option>
    <option value="30">30秒</option>
  </select>
</div>

<div class="main">
  <div id="map"></div>
  <button class="toggle-sidebar" onclick="toggleSidebar()">📋 航班列表</button>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>📋 航班 <span id="list-total" style="color:#00d4ff;"></span></h3>
      <span class="time-badge" id="update-time"></span>
    </div>
    <div class="flight-list" id="flight-list">
      <div style="text-align:center;color:#666;padding:40px;">📡 加载中...</div>
    </div>
  </div>
</div>

<script>
const AIRLINES = {
  CES:"东航",CSN:"南航",CCA:"国航",CSC:"川航",CXA:"厦航",CSZ:"深航",
  CQH:"春秋",GCR:"天津航",HDA:"国泰",CAL:"华航",EVA:"长荣",AMU:"澳门航",
  ANA:"全日空",JAL:"日航",KAL:"大韩",SIA:"新航",THA:"泰航",
  UAL:"美联航",DAL:"达美",AAL:"美航",BAW:"英航",AFR:"法航",DLH:"汉莎",
  UAE:"阿联酋",QTR:"卡塔尔",ETD:"阿提哈德",QFA:"澳航",
};

function airline(code){ return AIRLINES[code?.slice(0,3)]||code?.slice(0,3)||"?"; }

const map = L.map('map',{zoomControl:true,attributionControl:false}).setView([31.2,121.5],7);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);

const flightLayer = L.layerGroup().addTo(map);
let autoRefresh, markerMap={}, currentCenter='shanghai';

const centers = {
  shanghai:{lat:31.23,lon:121.47,zoom:7},
  beijing:{lat:39.90,lon:116.41,zoom:7},
  guangzhou:{lat:23.13,lon:113.26,zoom:7},
  chengdu:{lat:30.57,lon:104.07,zoom:7},
};

const AIRPORTS = [
  ["上海浦东",31.14,121.81],["上海虹桥",31.20,121.34],["北京首都",40.08,116.58],
  ["广州白云",23.39,113.31],["深圳宝安",22.64,113.81],["成都天府",30.32,104.44],
  ["杭州萧山",30.23,120.43],["南京禄口",31.74,118.86],["香港",22.31,113.91],
  ["东京成田",35.76,140.39],["首尔仁川",37.46,126.44],["新加坡",1.36,103.99],
];
AIRPORTS.forEach(([n,la,lo])=>{
  L.circleMarker([la,lo],{radius:2,color:'#4a4a8a',fillColor:'#2a2a6a',fillOpacity:0.8,weight:1})
   .addTo(map).bindTooltip(n,{direction:'top',offset:[0,-4]});
});

function planeIcon(track,alt_ft,ground){
  const rot=track??0, size=ground?10:14;
  let c='#4cff4c';
  if(alt_ft!=null){if(alt_ft>35000)c='#ff6bff';else if(alt_ft>25000)c='#00d4ff';else if(alt_ft>10000)c='#ffd700';}
  if(ground)c='#888';
  const svg=`<svg width="${size+6}" height="${size+6}" xmlns="http://www.w3.org/2000/svg"><g transform="translate(${(size+6)/2},${(size+6)/2}) rotate(${rot})"><path d="M0,-${size/2} L${size/3},${size/2} L0,${size/6} L-${size/3},${size/2} Z" fill="${c}" opacity="0.9"/></g></svg>`;
  return L.divIcon({html:svg,className:'',iconSize:[size+6,size+6],iconAnchor:[(size+6)/2,(size+6)/2]});
}

function altClass(m){if(m==null)return'';if(m>10600)return'alt-high';if(m>7600)return'alt-cruise';if(m>3000)return'alt-climb';return'alt-low';}

async function fetchData(){
  const c=centers[currentCenter];
  const radius=document.getElementById('radius-select').value;
  const airline=document.getElementById('airline-filter').value;
  const apiUrl=`https://api.adsb.lol/v2/lat/${c.lat}/lon/${c.lon}/dist/${radius}`;
  const url=`https://corsproxy.io/?${encodeURIComponent(apiUrl)}`;
  try{
    const resp=await fetch(url);
    if(!resp.ok)throw new Error(`HTTP ${resp.status}`);
    const data=await resp.json();
    return (data.ac||[]).filter(a=>!airline||(a.flight||'').startsWith(airline));
  }catch(e){
    document.getElementById('update-time').innerHTML='<span style="color:#ff4444">API 错误</span>';
    return null;
  }
}

function renderFlights(flights){
  if(!flights){document.getElementById('update-time').innerHTML='<span style="color:#ff4444">重试中...</span>';return;}

  const airborne=flights.filter(f=>(f.alt_baro??f.alt_geom??99999)>0).length;
  document.getElementById('stat-count').textContent=flights.length;
  document.getElementById('stat-airborne').textContent=airborne;
  document.getElementById('list-total').textContent=`(${flights.length})`;

  const now=new Date();
  const ts=now.toLocaleTimeString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'});
  document.getElementById('stat-time').textContent=ts;
  document.getElementById('update-time').innerHTML=`<span class="status-dot ok"></span> ${ts}`;

  flightLayer.clearLayers();
  markerMap={};

  const circleRadius=parseInt(document.getElementById('radius-select').value)*1852;
  L.circle([centers[currentCenter].lat,centers[currentCenter].lon],{
    radius:circleRadius,color:'#00d4ff',weight:1,fillOpacity:0.03,dashArray:'5,5'
  }).addTo(flightLayer);

  flights.forEach(a=>{
    const lat=a.lat,lon=a.lon;
    if(lat==null||lon==null)return;
    const alt=a.alt_baro??a.alt_geom;
    const ground=alt!=null&&alt<=0;
    const icon=planeIcon(a.track,alt,ground);
    const m=L.marker([lat,lon],{icon}).addTo(flightLayer);

    const altFt=alt!=null?`${Math.round(alt)}ft (${Math.round(alt*0.3048)}m)`:'—';
    const spd=a.gs!=null?`${Math.round(a.gs*1.852)}km/h`:'—';
    const cs=(a.flight||'').trim()||'N/A';
    m.bindPopup(`<div style="min-width:130px"><b>${cs}</b><br><span style="color:#888">${airline(cs)}</span><br><span style="color:#00d4ff">📏 ${altFt}</span><br>💨 ${spd} &nbsp; 🧭 ${a.track!=null?Math.round(a.track)+'°':'—'}<br>${ground?'🅿️ 地面':'✈️ 飞行中'}</div>`);
    markerMap[a.hex||cs]=m;
  });

  // Sidebar
  const listEl=document.getElementById('flight-list');
  if(!flights.length){listEl.innerHTML='<div style="text-align:center;color:#666;padding:40px;">😴 无航班</div>';return;}
  listEl.innerHTML=flights.slice(0,80).map(a=>{
    const cs=(a.flight||'').trim()||'N/A';
    const alt=a.alt_baro??a.alt_geom;
    const altFt=alt!=null?`${Math.round(alt)}ft`:'—';
    const spd=a.gs!=null?`${Math.round(a.gs*1.852)}km/h`:'—';
    const ground=alt!=null&&alt<=0;
    const ac=altClass(alt!=null?Math.round(alt*0.3048):null);
    return `<div class="flight-card${ground?' ground':''}" onclick="flyTo(${a.lat},${a.lon},'${a.hex||cs}')">
      <div class="top"><span class="callsign">${cs}</span><span class="${ac}">${ground?'🅿️':'✈️'} ${altFt}</span></div>
      <div class="airline">${airline(cs)}</div>
      <div class="info"><span>💨 ${spd}</span><span>🧭 ${a.track!=null?Math.round(a.track)+'°':'—'}</span></div>
    </div>`;
  }).join('');
}

function flyTo(lat,lon,key){map.setView([lat,lon],10);markerMap[key]?.openPopup();}

function setCenter(name){
  currentCenter=name;
  const c=centers[name];
  map.setView([c.lat,c.lon],c.zoom);
  document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+name).classList.add('active');
  fetchData().then(renderFlights);
}

function changeInterval(){
  if(autoRefresh)clearInterval(autoRefresh);
  const sec=parseInt(document.getElementById('refresh-interval').value)*1000;
  autoRefresh=setInterval(()=>fetchData().then(renderFlights),sec);
}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');}

fetchData().then(renderFlights);
autoRefresh=setInterval(()=>fetchData().then(renderFlights),10000);
</script>
</body>
</html>
